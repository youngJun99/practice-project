name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]  # develop 브랜치로의 PR도 트리거됨

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Make application-secret.yml
        run: |
          touch ./src/main/resources/application-secret.yml
          echo "${{ secrets.APPLICATION_SECRET }}" > ./src/main/resources/application-secret.yml
        shell: bash

      - name: Build with Gradle Wrapper (Skip Tests)
        run: |
          ./gradlew --stop && ./gradlew clean --refresh-dependencies
          ./gradlew clean build -x test # 테스트 제외
          ls -l build/libs 

      - name: Deploy JAR to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ubuntu
          TARGET_DIR: /home/ubuntu/cicd/
        run: |
          # SSH 키 저장 (줄바꿈 유지)
          printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          # SSH 키 파일 정상 생성 여부 확인
          ls -l private_key.pem
          
          # SSH 연결 테스트 (EC2 접속 가능 여부 확인)
          ssh -i private_key.pem -o StrictHostKeyChecking=no $USER@$HOST "echo 'SSH Connection Successful'"
          
          # 빌드된 JAR 파일을 EC2로 전송 (디버깅용 -v 옵션 추가)
          scp -v -i private_key.pem -o StrictHostKeyChecking=no build/libs/*.jar $USER@$HOST:$TARGET_DIR

      - name: Run Application on EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ubuntu
          TARGET_DIR: /home/ubuntu/cicd/
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # EC2에서 기존 애플리케이션 종료 후 새 JAR 실행
          ssh -i private_key.pem -o StrictHostKeyChecking=no $USER@$HOST << EOF
            pkill -f 'java -jar' || echo "No existing app running"
            nohup java -jar $TARGET_DIR/*.jar > $TARGET_DIR/app.log 2>&1 &
          EOF


